<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f8ec">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我家寶貝的小心情">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>我家寶貝的小心情</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Iansui&display=swap" rel="stylesheet">
<style>
:root{--alpha:.85;--fs:16px;--onacc:#fff;--font:"Zen Maru Gothic","Kosugi Maru","PingFang TC","Noto Sans TC",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg) center/cover fixed no-repeat;color:var(--ink);font-family:var(--font);font-size:var(--fs);min-height:100vh;padding:env(safe-area-inset-top) 0 0}
#app{max-width:480px;margin:0 auto;padding:14px 14px 100px}
h1{flex-wrap:wrap;gap:2px 8px;font-size:1.25em;margin:6px 4px 12px;display:flex;justify-content:space-between;align-items:center}
h2{font-size:.95em;margin:18px 4px 8px;color:var(--ink);opacity:.75}
.card{background:color-mix(in srgb,var(--card) calc(var(--alpha)*100%),transparent);backdrop-filter:blur(6px);border-radius:22px;padding:14px;box-shadow:0 4px 16px rgba(255,143,171,.15);margin-bottom:12px}
textarea,input[type=text],input[type=time],input[type=url],select{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:10px 12px;font:inherit;outline:none}
textarea{resize:none;height:64px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mood{border:0;background:var(--ac2);border-radius:20px;padding:10px 4px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s}
.mood:active{transform:scale(.92)}
.mood b{font-size:2em;font-weight:400;height:1.2em;display:flex;align-items:center}.mood span{font-size:.8em}
.mi{width:1.2em;height:1.2em;border-radius:30%;object-fit:cover;vertical-align:middle}
.btn{border:0;background:var(--accent);color:var(--onacc);border-radius:999px;padding:9px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--ac2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{border:0;background:var(--ac2);color:var(--ink);border-radius:999px;padding:5px 10px;font:inherit;font-size:.82em;cursor:pointer}
.chip.on{background:var(--accent);color:var(--onacc)}
.item{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.item:last-child{border:0}
.av{width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;font-size:1.3em;flex:none}
.meta{font-size:.78em;opacity:.65}.txt{margin:2px 0;word-break:break-word}
.reply{font-size:.85em;background:var(--ac2);border-radius:12px;padding:4px 10px;display:inline-block;margin-top:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tabs);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(255,143,171,.2);z-index:5}
.tabs button{flex:1;max-width:100px;border:0;background:none;font:inherit;font-size:12px;color:var(--ink);opacity:.6;padding:6px 0;border-radius:14px}
.tabs button b{display:block;font-size:20px;font-weight:400}.tabs button.on{background:var(--ac2);color:var(--ink);opacity:1}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{padding:12px;border-radius:6px 18px 18px 18px;min-height:90px;font-size:.9em;position:relative;color:#5b4650;word-break:break-word;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.note small{display:block;margin-top:8px;opacity:.65;font-size:.75em}.note i{position:absolute;right:8px;top:6px;font-style:normal;opacity:.5}
.sos{position:relative;width:100%;border:0;border-radius:22px;background:color-mix(in srgb,var(--danger) 30%,var(--card));color:var(--ink);padding:16px;font:inherit;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.sos .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--danger);opacity:.55}.sos span{position:relative}
.ov{position:fixed;inset:0;background:rgba(60,30,40,.55);display:grid;place-items:center;z-index:20;padding:20px}
.ov .box{background:var(--pop);color:var(--popInk);border-radius:26px;padding:22px;max-width:340px;width:100%;text-align:center}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));background:var(--pop);color:var(--popInk);padding:10px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(255,143,171,.4);z-index:30;font-size:14px;max-width:90%}
.bar{display:flex;align-items:center;gap:6px;font-size:.85em;margin:4px 0}.bar div{height:12px;border-radius:6px;min-width:3px}
.sw{display:flex;align-items:center;justify-content:space-between;margin:10px 0;gap:10px}
.sw input[type=range]{flex:1}.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:.8em}
.grid4 .mood{padding:8px 2px}
svg{width:100%;height:auto;display:block}.empty{text-align:center;opacity:.6;padding:18px}
.cols{display:flex;align-items:flex-end;gap:3px;height:90px}.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1px}
</style>
</head>
<body>
<div id="app"></div><div class="tabs" id="tabs"></div>
<script>
const MOODS=[{k:"happy",e:"😊",n:"開心"},{k:"miss",e:"🥰",n:"想你"},{k:"hug",e:"🫂",n:"想抱抱"},{k:"tired",e:"😴",n:"累了"},{k:"sad",e:"😢",n:"難過"},{k:"mad",e:"😤",n:"生氣"},{k:"sleepy",e:"🥱",n:"想睡"},{k:"hungry",e:"🍙",n:"餓了"},{k:"normal",e:"🙂",n:"普通"},{k:"busy",e:"🏃",n:"好忙"},{k:"out",e:"🚶",n:"要出門"},{k:"home",e:"🏠",n:"到家了"}];
const REPLIES=["🤗 抱抱","💕 愛你","我在","晚點找你","☕ 陪你","忙碌中","撓你癢","我也想你","好好休息"];
const DEF={day:{bg:"#f1f8ec",card:"#ffffff",ink:"#44584a",accent:"#8fcf9f",ac2:"#d9efd9",tabs:"#ffffff",me:"#5fbf86",you:"#8ec5ff",line:"#dcebd8",danger:"#f2a6a6",pop:"#ffffff",popInk:"#44584a"},night:{bg:"#1b2620",card:"#2a3a31",ink:"#e6f2e8",accent:"#6fb98a",ac2:"#3d5245",tabs:"#2a3a31",me:"#8fe0a8",you:"#8ec5ff",line:"#3d5245",danger:"#c96a6a",pop:"#2a3a31",popInk:"#e6f2e8"}};
const COLS=[["bg","背景色"],["card","區塊色"],["ink","文字色"],["accent","按鈕色"],["ac2","次要按鈕・心情按鈕色"],["tabs","底部分頁列色"],["me","我的顏色（圖表）"],["you","對方顏色（圖表）"],["danger","急需陪伴色"],["pop","提示框底色"],["popInk","提示框文字色"],["line","分隔線色"]];
const lum=h=>{const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)};
const NOTECOL=["#ffe3ea","#fff1c9","#dff4e3","#dcecff","#ece0ff"];
const FONTS={round:'"Zen Maru Gothic","Kosugi Maru","PingFang TC","Noto Sans TC",sans-serif',hand:'"Iansui","PingFang TC",cursive',sys:'system-ui,"PingFang TC","Noto Sans TC",sans-serif'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast("儲存空間不足，請用較小的圖片");return false}};
let cfg=Object.assign({url:"",code:"",id:"u"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),on:true,from:"09:00",to:"22:00",fs:16,mode:"day",cols:{day:{},night:{}},alpha:.85,font:"round"},ld("cfg",{}));
let S=Object.assign({moods:{},notes:{},sos:{},people:{}},ld("data",{}));
let joined=false,cSub="chart",colSel="bg",tab="mood",draft="",view="both",range=7,mf="all",first=true;
const widget=location.hash==="#widget",remote=()=>cfg.url&&cfg.code;
const base=()=>cfg.url.replace(/\/$/,"")+"/couples/"+encodeURIComponent(cfg.code);
const api=(m,p,b,q)=>fetch(base()+p+".json"+(q||""),{method:m,body:b===undefined?undefined:JSON.stringify(b)}).then(r=>r.json());
const M=k=>MOODS.find(m=>m.k===k)||MOODS[0];
const ico=m=>m.e;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const arr=c=>Object.entries(S[c]||{}).map(([id,v])=>({id,...v})).sort((a,b)=>b.ts-a.ts);
const partner=()=>Object.keys(S.people).find(k=>k!==cfg.id);
const nameOf=id=>id===cfg.id?"我":(S.people[id]&&S.people[id].name)||"對方";
const colOf=id=>id===cfg.id?"var(--me)":"var(--you)";
const fmt=t=>new Date(t).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});
function inWin(){if(!cfg.on)return false;const d=new Date(),n=d.getHours()*60+d.getMinutes(),p=s=>{const a=s.split(":");return +a[0]*60+ +a[1]},f=p(cfg.from),t=p(cfg.to);return f<=t?(n>=f&&n<=t):(n>=f||n<=t)}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);try{const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(document.hidden){if(LN)LN.schedule({notifications:[{id:Date.now()%2147483000,title:"我家寶貝的小心情",body:m}]});else if(window.Notification&&Notification.permission==="granted")new Notification("我家寶貝的小心情",{body:m})}}catch(e){}}
const colors=()=>Object.assign({},DEF[cfg.mode]||DEF.day,(cfg.cols&&cfg.cols[cfg.mode])||{});
function apply(){const c=colors(),r=document.documentElement.style;for(const k in c)r.setProperty("--"+k,c[k]);r.setProperty("--onacc",lum(c.accent)>.4?"#2b3a30":"#ffffff");r.setProperty("--fs",cfg.fs+"px");r.setProperty("--alpha",cfg.alpha);r.setProperty("--font",FONTS[cfg.font]||FONTS.round);r.colorScheme=cfg.mode==="night"?"dark":"light";const m=document.querySelector('meta[name=theme-color]');if(m)m.content=c.bg}
/* data layer: local, plus Firebase Realtime Database REST if configured */
const persist=()=>sv("data",S);
const SETK=["on","from","to","fs","alpha","font","mode","cols"];let sT=null;
function saveCfg(){sv("cfg",cfg);if(remote()&&S.people[cfg.id]){clearTimeout(sT);sT=setTimeout(()=>{const st={};SETK.forEach(k=>st[k]=cfg[k]);S.people[cfg.id].settings=st;persist();api("PUT","/people/"+cfg.id+"/settings",st).catch(()=>{})},800)}}
const full=()=>remote()&&!S.people[cfg.id]&&Object.keys(S.people).length>=2;
const blocked=()=>{if(full()){toast("這組配對碼已經有兩位使用者了");return true}return false};
const sosDone=new Set();
function put(c,id,o){if(blocked())return;S[c][id]=o;persist();if(remote())api("PUT","/"+c+"/"+id,o).catch(()=>toast("同步失敗，稍後會再試"));render()}
function patch(c,id,f){if(blocked())return;Object.assign(S[c][id],f);persist();if(remote())api("PATCH","/"+c+"/"+id,f).catch(()=>{});render()}
function del(c,id){delete S[c][id];persist();if(remote())api("DELETE","/"+c+"/"+id).catch(()=>{});render()}
async function pull(manual){
  if(!remote())return;
  try{const K="?orderBy=%22%24key%22&limitToLast=",[pp,mo,no,so]=await Promise.all([api("GET","/people"),api("GET","/moods",K+500),api("GET","/notes",K+100),api("GET","/sos",K+30)]),r={people:pp,moods:mo,notes:no,sos:so};
    const seen=new Set(Object.keys(S.moods)),prev={},pS={};
    Object.entries(S.moods).forEach(([k,v])=>prev[k]=v.reply||"");Object.entries(S.sos).forEach(([k,v])=>pS[k]=v.resp||"");
    S={moods:r.moods||{},notes:r.notes||{},sos:r.sos||{},people:r.people||{}};
    if(!first){
      if(inWin())arr("moods").forEach(m=>{
        if(!seen.has(m.id)&&m.uid!==cfg.id)toast(nameOf(m.uid)+" 現在覺得 "+M(m.mood).e+M(m.mood).n+(m.text?"：「"+m.text+"」":""));
        if(m.uid===cfg.id&&m.reply&&seen.has(m.id)&&prev[m.id]!==m.reply)toast(nameOf(m.replyBy)+" 回應了你的心情："+m.reply)});
      arr("sos").forEach(x=>{if(x.uid===cfg.id&&x.resp&&x.id in pS&&!pS[x.id])toast(nameOf(partner())+(x.resp==="come"?" 說：我馬上來 🏃":" 說：我正在忙")+(x.respText?"「"+x.respText+"」":""))})}
    first=false;persist();
    if(manual&&full())toast("這個身分不在這組配對裡，而且已經有兩位使用者了");
    if(!S.people[cfg.id]&&!joined)askName(full());
    render();showSos()}catch(e){if(manual)toast("連線失敗，請檢查網址")}
}
function askName(onlyLogin){
  if($("#nameov"))return;const o=document.createElement("div");o.className="ov";o.id="nameov";
  const has=!!S.people[cfg.id],ni='autocapitalize="none" autocorrect="off" spellcheck="false"';
  o.innerHTML='<div class="box" style="max-height:90vh;overflow:auto"><div style="font-size:40px">🐰</div>'+(onlyLogin?'<p>這組配對碼已經有兩位使用者了。<br>如果你是其中一位，請用身分碼登入。</p>':'<p>'+(has?"改一個新名字吧":"先取一個可愛的名字吧")+'</p><input type="text" id="nm" maxlength="8" placeholder="例如：小熊" value="'+(has?esc(S.people[cfg.id].name):"")+'"><div class="row" style="margin-top:10px"><button class="btn" id="nmok">'+(has?"儲存":"開始")+'</button>'+(has?'<button class="btn ghost" id="nmx">取消</button>':"")+"</div>")+(has&&!onlyLogin?"":'<details style="margin-top:14px;text-align:left"'+(onlyLogin?" open":"")+'><summary class="meta" style="cursor:pointer;text-align:center">已經有身分碼？用身分碼登入</summary><div class="meta" style="margin:8px 0 4px">同步資料（和對方相同）</div><input type="url" id="nu" placeholder="資料庫網址" value="'+esc(cfg.url)+'" '+ni+'><p style="margin:4px 0"></p><input type="text" id="nc" placeholder="配對碼" value="'+esc(cfg.code)+'" '+ni+'><div class="meta" style="margin:8px 0 4px">我的身分碼</div><input type="text" id="nid" placeholder="在另一台裝置的設定裡複製" '+ni+'><div class="row" style="margin-top:10px"><button class="btn ghost" id="nlogin">登入</button>'+(onlyLogin?'<button class="btn ghost" id="nclose">先看看</button>':"")+"</div></details>")+"</div>";
  document.body.appendChild(o);
  const q=x=>o.querySelector(x);
  if(q("#nmok"))q("#nmok").onclick=()=>{const v=q("#nm").value.trim()||"我";joined=true;if(S.people[cfg.id])patch("people",cfg.id,{name:v});else put("people",cfg.id,{name:v});o.remove()};
  if(q("#nmx"))q("#nmx").onclick=()=>o.remove();
  if(q("#nclose"))q("#nclose").onclick=()=>{joined=true;o.remove()};
  if(q("#nlogin"))q("#nlogin").onclick=async()=>{cfg.url=q("#nu").value.trim();cfg.code=q("#nc").value.trim();sv("cfg",cfg);if(await login(q("#nid").value))o.remove()};
}
async function login(v){
  v=String(v||"").trim().toLowerCase();
  if(!v){toast("請輸入身分碼");return false}
  if(!remote()){toast("請先填入資料庫網址與配對碼");return false}
  try{
    const pp=await api("GET","/people")||{};
    if(!pp[v]){toast("找不到這個身分碼，請確認有沒有輸入錯誤");return false}
    cfg.id=v;const st=pp[v].settings;if(st)Object.assign(cfg,st);
    sv("cfg",cfg);apply();first=true;joined=true;
    await pull(true);render();toast("登入成功，資料與設定已同步 ✅");return true
  }catch(e){toast("連線失敗，請檢查網址與網路");return false}
}
function showSos(){
  const s=arr("sos").find(x=>x.uid!==cfg.id&&!x.resp&&!sosDone.has(x.id)&&Date.now()-x.ts<6*3600e3),ex=$("#sosov");
  if(!s){if(ex)ex.remove();return}if(ex)return;
  const o=document.createElement("div");o.className="ov";o.id="sosov";
  o.innerHTML='<div class="box"><div style="font-size:48px">🥺</div><h3>'+esc(nameOf(s.uid))+' 現在需要你陪</h3>'+(s.text?'<p>「'+esc(s.text)+'」</p>':"")+'<p class="meta">'+fmt(s.ts)+' 送出</p><textarea id="sostx" maxlength="80" placeholder="想回覆什麼嗎？（可不填）"></textarea><div class="row" style="margin-top:10px"><button class="btn" id="sosack">我馬上來 🏃</button><button class="btn ghost" id="sosbusy">我正在忙</button></div></div>';
  document.body.appendChild(o);toast(nameOf(s.uid)+" 需要你陪 🥺");
  const go=v=>{const tx=o.querySelector("#sostx").value.trim();sosDone.add(s.id);patch("sos",s.id,{resp:v,respText:tx,respTs:Date.now()});o.remove()};
  o.querySelector("#sosack").onclick=()=>go("come");o.querySelector("#sosbusy").onclick=()=>go("busy");
}
function sosStatus(){const x=arr("sos").find(y=>y.uid===cfg.id&&Date.now()-y.ts<6*3600e3);if(!x)return"";return '<div class="reply" style="margin-bottom:8px">'+(x.resp?esc(nameOf(partner()))+"回應："+(x.resp==="come"?"我馬上來 🏃":"我正在忙")+(x.respText?"「"+esc(x.respText)+"」":""):"已通知，等待回應…")+"</div>"}
/* views */
function render(){
  const a=document.activeElement;if(a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT"||a.tagName==="SELECT"))return;
  const T=$("#tabs");
  if(widget){T.style.display="none";$("#app").innerHTML='<div class="card"><div class="meta" style="text-align:center">點一下，直接告訴對方你的心情 💕</div>'+moodBtns()+"</div>";return}
  T.innerHTML=[["mood","💗","心情"],["chart","📈","圖表"],["note","💌","紙條"],["set","🌷","設定"]].map(t=>'<button data-tab="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'"><b>'+t[1]+"</b>"+t[2]+"</button>").join("");
  $("#app").innerHTML=({mood:moodHtml,chart:chartHtml,note:noteHtml,set:setHtml})[tab]();
  const ta=$("#draft");if(ta)ta.value=draft;
}
const moodBtns=()=>'<div class="moods">'+MOODS.map(m=>'<button class="mood" data-mood="'+m.k+'"><b>'+ico(m)+"</b><span>"+m.n+"</span></button>").join("")+"</div>";
function moodHtml(){
  const p=partner(),last=arr("moods").find(m=>m.uid===p);
  let h='<h1>💗 我家寶貝的小心情<span class="meta">'+esc(nameOf(cfg.id))+" ❤ "+esc(p?nameOf(p):"等待對方加入")+"</span></h1>";
  if(full())h+='<div class="card meta">⚠️ 這組配對碼已經有兩位使用者了，你目前無法送出內容。如果你是其中一位，請到「設定 → 我的身分」輸入你的身分碼。</div>';
  if(!remote())h+='<div class="card meta">目前是「單機模式」，只有你自己看得到。到設定填入同步資料，就能和對方互通 💞</div>';
  if(last)h+='<div class="card"><div class="meta">'+esc(nameOf(p))+" 最近的心情</div><div style=\"margin-top:4px\">"+ico(M(last.mood))+" "+M(last.mood).n+(last.text?"：「"+esc(last.text)+"」":"")+'</div><div class="meta">'+fmt(last.ts)+"</div>"+(last.reply?'<div class="reply">'+esc(nameOf(last.replyBy))+"："+esc(last.reply)+"</div>":(last.uid!==cfg.id?'<div class="chips" style="margin:8px 0 0">'+REPLIES.map(x=>'<button class="chip" data-reply="'+esc(x)+'" data-id="'+last.id+'">'+x+"</button>").join("")+"</div>":""))+"</div>";
  h+='<div class="card"><textarea id="draft" maxlength="120" placeholder="想說點什麼嗎？（可不填）點下面的心情就會一起送出～"></textarea>'+moodBtns()+"</div>";
  h+='<h2>🆘 急需陪伴</h2><div class="card">'+sosStatus()+'<button class="sos" id="sosbtn"><div class="fill"></div><span>長按 1.5 秒，呼叫對方陪我</span></button></div>';
  return h;
}
function feedItem(m){
  let h='<div class="item"><div class="av" style="background:'+colOf(m.uid)+'33">'+ico(M(m.mood))+'</div><div style="flex:1"><div class="meta">'+esc(nameOf(m.uid))+" · "+fmt(m.ts)+'</div><div class="txt">'+(m.text?esc(m.text):M(m.mood).n)+"</div>"+(m.reply?'<div class="reply">'+esc(nameOf(m.replyBy))+"：" +esc(m.reply)+"</div>":"");
  if(m.uid!==cfg.id&&!m.reply)h+='<div class="chips" style="margin-top:8px">'+REPLIES.map(r=>'<button class="chip" data-reply="'+esc(r)+'" data-id="'+m.id+'">'+r+"</button>").join("")+"</div>";
  return h+"</div></div>";
}
function chartHtml(){
  const now=Date.now(),from=now-range*864e5,p=partner(),ids=view==="me"?[cfg.id]:view==="you"?[p]:[cfg.id,p];
  const all=arr("moods").filter(m=>m.ts>=from&&ids.includes(m.uid)&&(mf==="all"||m.mood===mf)),L=all.slice().sort((a,b)=>a.ts-b.ts);
  let h='<h1>📈 圖表</h1><div class="chips">'+[["chart","📈 心情圖表"],["feed","🕒 最近動態"],["dist","📊 心情分布"]].map(v=>'<button class="chip '+(cSub===v[0]?"on":"")+'" data-sub="'+v[0]+'">'+v[1]+"</button>").join("")+'</div><div class="card"><div class="chips">'+[["me","只看我"],["you","只看"+esc(p?nameOf(p):"對方")],["both","雙方"]].map(v=>'<button class="chip '+(view===v[0]?"on":"")+'" data-view="'+v[0]+'">'+v[1]+"</button>").join("")+'</div><div class="chips">'+[[1,"今天"],[7,"7 天"],[30,"30 天"]].map(v=>'<button class="chip '+(range===v[0]?"on":"")+'" data-range="'+v[0]+'">'+v[1]+"</button>").join("")+'</div><select id="mfsel"><option value="all">全部心情</option>'+MOODS.map(m=>'<option value="'+m.k+'"'+(mf===m.k?" selected":"")+">"+m.e+" "+m.n+"</option>").join("")+"</select></div>";
  if(cSub==="feed")return h+'<div class="card">'+(all.length?all.slice(0,50).map(feedItem).join(""):'<div class="empty">這段時間還沒有心情 🌸</div>')+"</div>";
  if(cSub==="chart"){
    const rows=mf==="all"?MOODS:[M(mf)],W=340,l=34,r=10,t=10,b=24,rh=rows.length>1?30:60,H=t+b+rh*rows.length;
    let s='<svg viewBox="0 0 '+W+" "+H+'">';
    rows.forEach((m,i)=>{const y=t+rh*i+rh/2;s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)"/>'+'<text x="4" y="'+(y+6)+'" font-size="17">'+m.e+"</text>"});
    const tk=range===1?6:range===7?7:5;
    for(let i=0;i<=tk;i++){const x=l+(W-l-r)*i/tk,d=new Date(from+(now-from)*i/tk);s+='<text x="'+x+'" y="'+(H-6)+'" font-size="10" style="fill:var(--ink);opacity:.6" text-anchor="middle">'+(range===1?d.getHours()+"時":(d.getMonth()+1)+"/"+d.getDate())+"</text>"}
    L.forEach(m=>{const x=l+(W-l-r)*(m.ts-from)/(now-from),i=rows.findIndex(q=>q.k===m.mood),off=ids.length>1?(m.uid===cfg.id?-5:5):0;s+='<circle cx="'+x+'" cy="'+(t+rh*i+rh/2+off)+'" r="6" style="fill:'+colOf(m.uid)+'" opacity=".85"><title>'+esc(nameOf(m.uid))+" "+fmt(m.ts)+"</title></circle>"});
    return h+'<div class="card">'+s+'</svg><div class="meta" style="display:flex;gap:12px;justify-content:center"><span style="color:var(--me)">● 我</span>'+(p?'<span style="color:var(--you)">● '+esc(nameOf(p))+"</span>":"")+"</div></div>";
  }
  if(mf==="all"){
    const cnt=(k,id)=>L.filter(x=>x.mood===k&&x.uid===id).length,mx=Math.max(1,...MOODS.map(m=>Math.max(...ids.map(id=>cnt(m.k,id)))));
    return h+'<div class="card">'+MOODS.map(m=>'<div class="bar"><span style="width:5.5em">'+ico(m)+" "+m.n+'</span><div style="flex:1;display:flex;flex-direction:column;gap:2px;height:auto;background:none;min-width:0">'+ids.map(id=>'<div style="background:'+colOf(id)+";width:"+cnt(m.k,id)/mx*100+'%"></div>').join("")+'</div><span class="meta">'+ids.map(id=>cnt(m.k,id)).join(" / ")+"</span></div>").join("")+"</div>";
  }
  const n=Math.max(1,range),days=[];for(let i=n-1;i>=0;i--){const d=new Date(now-i*864e5);d.setHours(0,0,0,0);days.push(d.getTime())}
  const c=(id,d)=>L.filter(x=>x.uid===id&&x.ts>=d&&x.ts<d+864e5).length,mx=Math.max(1,...days.map(d=>ids.reduce((a,id)=>a+c(id,d),0)));
  return h+"<h2>"+ico(M(mf))+" "+M(mf).n+" 每天次數</h2><div class=\"card\"><div class=\"cols\">"+days.map(d=>"<div title=\""+new Date(d).toLocaleDateString("zh-TW")+"\">"+ids.map(id=>'<span style="display:block;border-radius:4px;background:'+colOf(id)+";height:"+c(id,d)/mx*80+'px"></span>').join("")+"</div>").join("")+'</div><div class="meta" style="margin-top:6px">合計：'+ids.map(id=>nameOf(id)+" "+L.filter(x=>x.uid===id).length+" 次").join("　")+"</div></div>";
}
function noteHtml(){
  let h='<h1>💌 小紙條</h1><div class="card"><textarea id="ntxt" maxlength="150" placeholder="寫一張小紙條給對方…"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="nsend">貼上去 📌</button></div></div><div class="notes">';
  const N=arr("notes").slice(0,30);
  return h+(N.length?N.map(n=>'<div class="note" style="background:'+n.color+'">'+(n.uid===cfg.id?'<i data-delnote="'+n.id+'">✕</i>':"")+esc(n.text)+"<small>"+esc(nameOf(n.uid))+" · "+fmt(n.ts)+"</small></div>").join(""):'<div class="empty" style="grid-column:1/3">牆上還沒有紙條 🌿</div>')+"</div>";
}
function setHtml(){
  const sl=(id,lab,min,max,st,v)=>'<div class="sw"><span style="white-space:nowrap">'+lab+'</span><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+st+'" value="'+v+'"></div>';
  let h='<h1>🌷 設定</h1><div class="card"><b>🎨 外觀</b><div class="chips" style="margin:8px 0"><button class="chip '+(cfg.mode==="day"?"on":"")+'" data-mode="day">☀️ 日間</button><button class="chip '+(cfg.mode==="night"?"on":"")+'" data-mode="night">🌙 夜間</button></div>'+sl("fs","文字大小",12,24,1,cfg.fs)+'<div class="sw"><span style="white-space:nowrap">調整顏色</span><select id="colsel" style="width:auto;flex:1">'+COLS.map(c=>'<option value="'+c[0]+'"'+(colSel===c[0]?" selected":"")+">"+c[1]+"</option>").join("")+'</select><input type="color" data-col="'+colSel+'" value="'+colors()[colSel]+'"></div><div class="meta">目前編輯：'+(cfg.mode==="day"?"日間":"夜間")+"模式</div>"+sl("al","區塊透明度",.2,1,.05,cfg.alpha)+'<div class="sw"><span>字體</span><select id="fo" style="width:auto"><option value="round"'+(cfg.font==="round"?" selected":"")+'>可愛圓體</option><option value="hand"'+(cfg.font==="hand"?" selected":"")+'>手寫風</option><option value="sys"'+(cfg.font==="sys"?" selected":"")+'>系統預設</option></select></div><div class="row"><button class="btn ghost" id="colreset">恢復預設顏色</button></div></div>';
  h+='<div class="card"><b>🔔 通知</b><div class="sw"><span>接收對方心情通知</span><button class="chip '+(cfg.on?"on":"")+'" id="tgl">'+(cfg.on?"開":"關")+'</button></div><div class="meta">只在這段時間內通知我</div><div style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="time" id="tf" value="'+cfg.from+'"><span>～</span><input type="time" id="tt" value="'+cfg.to+'"></div><div class="meta" style="margin-top:8px">目前'+(inWin()?"在通知時段內 ✅":"不在通知時段 🌙")+"</div></div>";
  h+='<div class="card"><b>💞 和對方同步</b><div class="meta" style="margin:4px 0 8px">兩人填入相同的資料庫網址與配對碼（最多 2 人，作法見 README）</div><input type="url" id="fu" placeholder="https://你的專案-default-rtdb.firebaseio.com" value="'+esc(cfg.url)+'"><p style="margin:6px 0"></p><input type="text" id="fc" placeholder="配對碼（自訂一串難猜的字）" value="'+esc(cfg.code)+'"><div class="row" style="margin-top:8px"><button class="btn" id="fsave">儲存並同步</button></div></div>';
  h+='<div class="card"><b>🔑 我的身分</b><div class="meta" style="margin:4px 0 8px">換手機或多台裝置時，在另一台輸入同一個身分碼，就能用同一個身分登入。請不要分享給別人。</div><div class="sw"><code style="word-break:break-all">'+esc(cfg.id)+'</code><button class="chip" id="cpid">複製</button></div><input type="text" id="lid" placeholder="在這台輸入另一台的身分碼" autocapitalize="none" autocorrect="off" spellcheck="false"><div class="row" style="margin-top:8px"><button class="btn" id="login">登入此身分</button></div></div>';
  return h+'<div class="card"><div class="sw"><span>🐰 我的名字</span><button class="chip" id="rename">'+esc(nameOf(cfg.id))+' ✎</button></div><div class="sw"><span>🧩 小工具模式</span><a class="btn ghost" href="#widget" onclick="setTimeout(()=>location.reload(),50)">開啟</a></div><div class="meta">把小工具模式加到手機主畫面，就能一鍵送心情。</div></div>';
}
/* events */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,i");if(!t)return;const d=t.dataset;
  if(d.tab){tab=d.tab;render();return}
  if(d.view){view=d.view;render();return}if(d.range){range=+d.range;render();return}if(d.sub){cSub=d.sub;render();return}
  if(d.mode){cfg.mode=d.mode;saveCfg();apply();render();return}
  if(d.mood){const ta=$("#draft"),text=ta?ta.value.trim():"";draft="";if(ta)ta.value="";put("moods",uid(),{uid:cfg.id,mood:d.mood,text,ts:Date.now()});toast(M(d.mood).e+" 已送出");return}
  if(d.reply){patch("moods",d.id,{reply:d.reply,replyBy:cfg.id});return}
  if(t.id==="nsend"){const v=$("#ntxt").value.trim();if(!v)return;put("notes",uid(),{uid:cfg.id,text:v,ts:Date.now(),color:NOTECOL[Math.floor(Math.random()*5)]});toast("💌 小紙條已貼上");return}
  if(d.delnote){del("notes",d.delnote);return}
  if(t.id==="tgl"){cfg.on=!cfg.on;saveCfg();try{if(cfg.on&&window.Notification&&Notification.permission==="default")Notification.requestPermission()}catch(x){}render();return}
  if(t.id==="rename"){askName();return}
  if(t.id==="colreset"){cfg.cols[cfg.mode]={};saveCfg();apply();render();toast("已恢復"+(cfg.mode==="day"?"日間":"夜間")+"預設顏色");return}
  if(t.id==="cpid"){navigator.clipboard.writeText(cfg.id).then(()=>toast("已複製身分碼"),()=>toast("請手動複製身分碼"));return}
  if(t.id==="login"){login($("#lid").value);return}
  if(t.id==="fsave"){cfg.url=$("#fu").value.trim();cfg.code=$("#fc").value.trim();saveCfg();first=true;toast("已儲存，同步中…");joined=false;pull(true);render()}
});
document.addEventListener("input",e=>{const i=e.target.id;
  if(i==="draft")draft=e.target.value;
  if(i==="fs"){cfg.fs=+e.target.value;apply()}if(e.target.dataset.col){cfg.cols[cfg.mode]=cfg.cols[cfg.mode]||{};cfg.cols[cfg.mode][e.target.dataset.col]=e.target.value;apply()}if(i==="al"){cfg.alpha=+e.target.value;apply()}});
document.addEventListener("change",async e=>{const i=e.target.id,t=e.target;
  if(["fs","al"].includes(i)||t.dataset.col)saveCfg();
  if(i==="colsel"){colSel=t.value;t.blur();render()}
  if(i==="mfsel"){mf=t.value;t.blur();render()}
  if(i==="fo"){cfg.font=t.value;saveCfg();apply()}
  if(i==="tf"||i==="tt"){cfg[i==="tf"?"from":"to"]=t.value;saveCfg();render()}
});
document.addEventListener("focusout",()=>setTimeout(render,80));
let hT=null,hS=0;
document.addEventListener("pointerdown",e=>{const b=e.target.closest("#sosbtn");if(!b)return;const f=b.querySelector(".fill");hS=Date.now();hT=setInterval(()=>{const p=Math.min(1,(Date.now()-hS)/1500);f.style.width=p*100+"%";if(p>=1){hEnd();confirmSos()}},30)});
function hEnd(){clearInterval(hT);hT=null;const f=$("#sosbtn .fill");if(f)f.style.width="0"}
["pointerup","pointercancel","pointerleave"].forEach(v=>document.addEventListener(v,()=>{if(hT)hEnd()}));
document.addEventListener("contextmenu",e=>{if(e.target.closest("#sosbtn"))e.preventDefault()});
function confirmSos(){const o=document.createElement("div");o.className="ov";o.innerHTML='<div class="box"><div style="font-size:44px">🥺</div><p>要通知對方「我現在需要陪伴」嗎？</p><textarea id="sostx2" maxlength="80" placeholder="想說點什麼嗎？（可不填）"></textarea><div class="row" style="margin-top:10px"><button class="btn" id="y">是的，請來陪我</button><button class="btn ghost" id="n">按錯了</button></div></div>';document.body.appendChild(o);o.querySelector("#n").onclick=()=>o.remove();o.querySelector("#y").onclick=()=>{put("sos",uid(),{uid:cfg.id,ts:Date.now(),text:o.querySelector("#sostx2").value.trim()});o.remove();toast("已通知對方，你不是一個人 💗")}}
window.addEventListener("hashchange",()=>location.reload());
apply();render();if(!remote()&&!S.people[cfg.id])setTimeout(askName,400);
pull();setInterval(()=>{if(!document.hidden)pull()},10000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
try{const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(LN)LN.requestPermissions()}catch(e){}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
